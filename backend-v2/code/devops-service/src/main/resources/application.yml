server:
  port: 8084

spring:
  application:
    name: devops-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

gitea:
  api-url: ${GITEA_API_URL:http://localhost:3030/api/v1}
  external-url: ${GITEA_EXTERNAL_URL:http://localhost:3030}
  admin-username: ${GITEA_ADMIN_USERNAME:gitea_admin}
  admin-password: ${GITEA_ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

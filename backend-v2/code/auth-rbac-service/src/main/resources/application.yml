server:
  port: 8081

spring:
  application:
    name: auth-rbac-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_rbac_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDP_JWKS_URI:http://localhost:8180/realms/enterprise/protocol/openid-connect/certs}
          issuer-uri: ${IDP_ISSUER_URI:http://localhost:8180/realms/enterprise}

idp:
  default-provider: ${IDP_PROVIDER_NAME:KEYCLOAK}
  auto-provisioning:
    enabled: true
    default-role: ROLE_ADMIN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Route: Authentication & RBAC Service (Public / Login / SSO / Token refresh)
        - id: auth-rbac-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Route: Inventory Service (Admin Warehouse & Stock Management)
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0

        # Route: Order Service (Admin Order Management & Approvals)
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # Route: DevOps / Platform Service (Service Catalog, Git Management, CI/CD, K8s)
        - id: devops-service
          uri: ${DEVOPS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/platform/**
          filters:
            - StripPrefix=0

# Security / Token Introspection configuration
security:
  auth-service:
    introspect-url: ${AUTH_INTROSPECT_URL:http://localhost:8081/internal/v1/auth/introspect}
  cache:
    ttl-seconds: 120
  public-paths:
    - /api/v1/auth/**
    - /actuator/health
    - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

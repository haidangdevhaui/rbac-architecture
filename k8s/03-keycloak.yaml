apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: enterprise-dev
data:
  enterprise-realm.json: |
    {
      "realm": "enterprise",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "roles": {
        "realm": [
          {
            "name": "default-roles-enterprise",
            "description": "${role_default-roles}",
            "composite": true,
            "clientRole": false
          }
        ]
      },
      "clients": [
        {
          "clientId": "admin-portal",
          "name": "Admin Portal Frontend & API Client",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "redirectUris": [
            "http://localhost:3000/*",
            "http://localhost:8080/*"
          ],
          "webOrigins": [
            "*"
          ]
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@enterprise.com",
          "firstName": "Admin",
          "lastName": "Super",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ]
        },
        {
          "username": "warehouse_mgr",
          "enabled": true,
          "email": "warehouse.mgr@enterprise.com",
          "firstName": "Kho",
          "lastName": "Trưởng",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "pass123",
              "temporary": false
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: enterprise-dev
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.2
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak_db"
            - name: KC_DB_USERNAME
              value: "postgres"
            - name: KC_DB_PASSWORD
              value: "postgres"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/enterprise-realm.json
              subPath: enterprise-realm.json
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 35
            periodSeconds: 15
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: enterprise-dev
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: internal-http
  selector:
    app: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: enterprise-dev
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  ports:
    - port: 8180
      targetPort: 8080
      name: http
  selector:
    app: keycloak

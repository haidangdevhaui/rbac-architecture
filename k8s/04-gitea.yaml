apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-pvc
  namespace: enterprise-dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: enterprise-dev
  labels:
    app: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22.3
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: "postgres:5432"
            - name: GITEA__database__NAME
              value: "gitea_db"
            - name: GITEA__database__USER
              value: "postgres"
            - name: GITEA__database__PASSWD
              value: "postgres"
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__server__ROOT_URL
              value: "http://localhost:3030/"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: GITEA__api__ENABLE_SWAGGER
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__admin__DEFAULT_ADMIN_USER
              value: "gitea_admin"
            - name: GITEA__admin__DEFAULT_ADMIN_EMAIL
              value: "admin@enterprise.local"
            - name: GITEA__admin__DEFAULT_ADMIN_PASSWORD
              value: "admin123"
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: enterprise-dev
  labels:
    app: gitea
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http-internal
  selector:
    app: gitea
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-external
  namespace: enterprise-dev
  labels:
    app: gitea
spec:
  type: LoadBalancer
  ports:
    - port: 3030
      targetPort: 3000
      name: http-external
    - port: 2222
      targetPort: 22
      name: ssh
  selector:
    app: gitea

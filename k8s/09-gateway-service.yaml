apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: enterprise-dev
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: backend-v2-gateway-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: AUTH_SERVICE_URL
              value: "http://auth-rbac-service:8081"
            - name: AUTH_INTROSPECT_URL
              value: "http://auth-rbac-service:8081/internal/v1/auth/introspect"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8082"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8083"
            - name: DEVOPS_SERVICE_URL
              value: "http://devops-service:8084"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: enterprise-dev
  labels:
    app: gateway-service
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: gateway-service
